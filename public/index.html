<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Build: 2026-01-25 -->
    <title>AI Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- highlight.js (code syntax highlight) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">


    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- KaTeX -->
    <style>
        /* Markdown basic styles */
        .markdown-content h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0.8em 0 0.35em;
        }

        .markdown-content h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0.75em 0 0.35em;
        }

        .markdown-content h3 {
            font-size: 1.125rem;
            font-weight: 650;
            margin: 0.65em 0 0.3em;
        }

        .markdown-content h4 {
            font-size: 1rem;
            font-weight: 650;
            margin: 0.6em 0 0.25em;
        }

        .markdown-content p {
            margin: 0.5em 0;
        }

        .markdown-content ul {
            list-style: disc;
            padding-left: 1.25rem;
            margin: 0.5em 0;
        }

        .markdown-content ol {
            list-style: decimal;
            padding-left: 1.25rem;
            margin: 0.5em 0;
        }

        .markdown-content li {
            margin: 0.2em 0;
        }

        .markdown-content blockquote {
            border-left: 4px solid rgba(148, 163, 184, .7);
            padding-left: 0.75rem;
            color: rgba(71, 85, 105, 1);
            margin: 0.75rem 0;
        }

        .markdown-content a {
            text-decoration: underline;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid rgba(226, 232, 240, 1);
            margin: 1rem 0;
        }

        .markdown-content pre {
            background: rgba(248, 250, 252, 1);
            border: 1px solid rgba(226, 232, 240, 1);
            border-radius: 0.75rem;
            padding: 0.75rem;
            overflow-x: auto;
            margin: 0.75rem 0;
        }

        .markdown-content code {
            background: rgba(248, 250, 252, 1);
            border: 1px solid rgba(226, 232, 240, 1);
            border-radius: 0.4rem;
            padding: 0.1rem 0.35rem;
            font-size: 0.9em;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.75rem 0;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid rgba(226, 232, 240, 1);
            padding: 0.5rem;
            text-align: left;
            vertical-align: top;
        }

        .markdown-content th {
            background: rgba(248, 250, 252, 1);
        }
    </style>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <style>
        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .5);
            border-radius: 999px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, .8);
        }
    </style>
</head>

<body class="bg-slate-50">
    <div class="h-screen flex">

        <!-- Sidebar (desktop) -->
        <aside class="hidden md:flex w-72 flex-col border-r bg-white">
            <div class="p-3 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div
                        class="w-8 h-8 rounded-lg bg-slate-900 text-white flex items-center justify-center font-semibold">
                        AI</div>
                    <div class="leading-tight">
                        <div class="text-sm font-semibold text-slate-900">AI Chat</div>
                        <div class="text-xs text-slate-500">本地聊天记录</div>
                    </div>
                </div>

                <button id="newChatBtn" class="p-2 rounded-lg hover:bg-slate-100 text-slate-700" title="新建聊天">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                </button>
            </div>

            <div class="px-3 pb-3">
                <div class="text-xs text-slate-500 mb-2">聊天历史</div>
                <div id="chatList" class="custom-scrollbar overflow-y-auto h-[calc(100vh-92px)] space-y-2"></div>
            </div>
        </aside>

        <!-- Main -->
        <main class="flex-1 flex flex-col">

            <!-- Top bar -->
            <div class="h-12 border-b bg-white flex items-center justify-between px-3 md:px-4">
                <div class="flex items-center gap-2 min-w-0">
                    <button id="mobileSidebarBtn" class="md:hidden p-2 rounded-lg hover:bg-slate-100">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>

                    <div class="min-w-0">
                        <div id="chatTitle" class="text-sm font-medium text-slate-900 truncate">新对话</div>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <select id="modelSelect"
                        class="px-2 py-1.5 text-sm border border-slate-300 rounded-lg bg-white text-slate-800 max-w-[180px]"
                        disabled>
                    </select>

                    <button id="settingsBtn" class="p-2 rounded-lg hover:bg-slate-100" title="设置">
                        <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                            </path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                    </button>
                </div>
            </div>


            <!-- Edit Banner -->
            <div id="editBanner" class="hidden border-b bg-amber-50 text-amber-800">
                <div class="max-w-3xl mx-auto px-4 py-2 flex items-center justify-between gap-3">
                    <div class="text-sm">正在编辑上一条消息，修改后发送会从这里重新生成后续回复。</div>
                    <button id="cancelEditBtn"
                        class="px-3 py-1.5 rounded-xl border border-amber-200 hover:bg-amber-100 text-sm">
                        取消编辑
                    </button>
                </div>
            </div>

            <!-- Messages -->
            <div id="messagesContainer" class="flex-1 custom-scrollbar overflow-y-auto">
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-4" id="messagesInner">
                    <div id="emptyState" class="py-16 text-center text-slate-500">
                        <div class="text-lg font-semibold text-slate-700 mb-2">开始新对话</div>
                        <div class="text-sm">输入消息后回车发送（Shift + Enter 换行）</div>
                    </div>
                </div>
            </div>

            <!-- Composer -->
            <div class="border-t border-slate-200 bg-slate-50">
                <div class="max-w-3xl mx-auto px-4 pt-3 pb-6 space-y-2">
                    <div class="rounded-3xl border border-slate-200 bg-white shadow-sm p-2 space-y-2">
                        <div class="hidden flex flex-wrap gap-2" id="attachmentsPreview"></div>
                        <form class="space-y-2" id="messageForm">
                            <div class="flex gap-2 items-end">
                                <!-- file -->
                                <label
                                    class="shrink-0 h-12 w-12 flex items-center justify-center rounded-3xl border border-slate-300 hover:bg-slate-50 cursor-pointer">
                                    <input accept="image/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx" class="hidden"
                                        id="fileInput" multiple="" type="file" />
                                    <svg class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor"
                                        viewbox="0 0 24 24">
                                        <path
                                            d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"
                                            stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
                                        </path>
                                    </svg>
                                </label>
                                <!-- input -->
                                <textarea
                                    class="flex-1 resize-none rounded-3xl border border-slate-300 px-4 py-3 min-h-[48px] text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
                                    disabled="" id="messageInput" placeholder="输入消息…" rows="1"></textarea>
                                <!-- send -->
                                <button
                                    class="shrink-0 h-12 px-4 py-3 rounded-3xl bg-slate-900 text-white hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed"
                                    disabled="" id="sendBtn" type="submit">
                                    发送
                                </button>
                            </div>
                            <div class="text-[11px] text-slate-500">
                                回车发送 · Shift+Enter 换行
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile sidebar overlay -->
    <div id="mobileSidebarOverlay" class="fixed inset-0 bg-black/30 hidden md:hidden">
        <div class="w-72 h-full bg-white shadow-xl">
            <div class="p-3 flex items-center justify-between border-b">
                <div class="text-sm font-semibold">聊天历史</div>
                <button id="closeMobileSidebarBtn" class="p-2 rounded-lg hover:bg-slate-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <div class="p-3">
                <button id="newChatBtnMobile"
                    class="w-full mb-3 px-3 py-2 rounded-lg bg-slate-900 text-white hover:bg-slate-800">
                    新建聊天
                </button>
                <div id="chatListMobile" class="custom-scrollbar overflow-y-auto h-[calc(100vh-140px)] space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-5">
            <div class="flex items-center justify-between mb-3">
                <div class="text-base font-semibold text-slate-900">对话设置</div>
                <button id="closeSettingsBtn" class="p-2 rounded-lg hover:bg-slate-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                        </path>
                    </svg>
                </button>
            </div>

            <div class="space-y-3">

                <div>
                    <label class="text-xs text-slate-600">System Prompt（可选）</label>
                    <textarea id="systemPrompt" rows="3"
                        class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm"
                        placeholder="例如：你是一个严谨的助手，用中文回答…"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-600 flex justify-between">
                            <span>Temperature</span><span id="tempValue" class="font-semibold">0.7</span>
                        </label>
                        <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7" class="w-full">
                    </div>
                    <div>
                        <label class="text-xs text-slate-600 flex justify-between">
                            <span>Top P</span><span id="topPValue" class="font-semibold">1.0</span>
                        </label>
                        <input type="range" id="topP" min="0" max="1" step="0.05" value="1" class="w-full">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-600 flex justify-between">
                            <span>Max Tokens</span><span id="maxTokensValue" class="font-semibold">2000</span>
                        </label>
                        <input type="range" id="maxTokens" min="100" max="16384" step="100" value="2000" class="w-full">
                    </div>

                    <div>
                        <label class="text-xs text-slate-600">Reasoning Effort（推理模型）</label>
                        <select id="reasoningEffort"
                            class="mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
                            <option value="low">Low（快）</option>
                            <option value="medium" selected>Medium（平衡）</option>
                            <option value="high">High（深度）</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-xs text-slate-600 flex justify-between">
                        <span>Verbosity（详细度）</span><span id="verbosityValue" class="font-semibold">1</span>
                    </label>
                    <input type="range" id="verbosity" min="0" max="2" step="1" value="1" class="w-full">
                    <div class="flex justify-between text-[11px] text-slate-500">
                        <span>简洁</span><span>标准</span><span>详细</span>
                    </div>
                </div>

                <label class="flex items-center gap-2 text-sm text-slate-700 select-none">
                    <input id="showReasoningSummary" type="checkbox" class="rounded border-slate-300">
                    显示“思考摘要”（推理模型）
                </label>

                <div class="flex justify-end gap-2 pt-2">
                    <button id="closeSettingsBtn2"
                        class="px-4 py-2 rounded-xl border border-slate-300 hover:bg-slate-50">
                        关闭
                    </button>
                </div>

                <div class="text-[11px] text-slate-500">
                    提示：推理模型（o1/o3/o4/gpt-5）不支持 temperature/top_p，后端已自动适配避免报错。
                </div>

            </div>
        </div>
    </div>

    <!-- Scroll to bottom -->
    <button id="scrollToBottomBtn"
        class="hidden fixed bottom-28 right-6 z-40 items-center gap-2 px-3 py-2 rounded-2xl bg-slate-900 text-white shadow-lg hover:bg-slate-800">
        <span class="text-sm">⬇ 回到底部</span>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
