name: Build WeatherKit custom bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-weatherkit-cn.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Download official WeatherKit v3.3.1 response bundle
        run: |
          mkdir -p surge
          curl -fL --retry 3 \
            https://github.com/NSRingo/WeatherKit/releases/download/v3.3.1/response.bundle.js \
            -o surge/weatherkit-cn-response.bundle.js

      - name: Patch CN next-hour behavior
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("surge/weatherkit-cn-response.bundle.js")
          s = p.read_text()

          if 'Version: 3.3.1' not in s:
              raise SystemExit('Downloaded bundle is not WeatherKit v3.3.1')

          guard = re.compile(
              r'if\(([A-Za-z_$][\w$]*)\.info\("☑️ InjectForecastNextHour"\),([A-Za-z_$][\w$]*)\)return\s+\1\.info\("✅ InjectForecastNextHour"\),\2;'
          )
          matches = list(guard.finditer(s))
          if len(matches) != 1:
              raise SystemExit(f'Expected one next-hour guard, found {len(matches)}')
          m = matches[0]
          logger, obj = m.group(1), m.group(2)
          replacement = (
              f'if({logger}.info("☑️ InjectForecastNextHour"),'
              f'{obj}&&"WeatherKit"===globalThis.$argument?.NextHour?.Provider)'
              f'return {logger}.info("✅ InjectForecastNextHour"),{obj};'
          )
          s = s[:m.start()] + replacement + s[m.end():]

          old = '"雨":"RAIN",snow:"SNOW"'
          new = '"雨":"RAIN","降水":"RAIN",snow:"SNOW"'
          if s.count(old) != 1:
              raise SystemExit('Expected one precipitation keyword sequence')
          s = s.replace(old, new, 1)

          light = re.compile(
              r'Math\.min\(1,\(([A-Za-z_$][\w$]*)-([A-Za-z_$][\w$]*)\.LIGHT\[0\]\)/\(\2\.LIGHT\[1\]-\2\.LIGHT\[0\]\)\)'
          )
          if len(list(light.finditer(s))) != 1:
              raise SystemExit('Expected one LIGHT interpolation')
          s = light.sub(r'Math.max(.101,Math.min(1,(\1-\2.LIGHT[0])/(\2.LIGHT[1]-\2.LIGHT[0])))', s, count=1)
          p.write_text(s)

      - name: Checkout WeatherKit v3.2.0 source
        uses: actions/checkout@v4
        with:
          repository: NSRingo/WeatherKit
          ref: v3.2.0
          path: weatherkit-v320

      - name: Build next-hour-only v3.2.0 response bundle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('weatherkit-v320/src/process/Response.mjs')
          s = p.read_text()
          old = '''parameters.dataSets.map(async dataSet => {
                                        switch (dataSet) {'''
          new = '''parameters.dataSets.map(async dataSet => {
                                        // Non-CN fallback bundle: preserve every Apple dataset except forecastNextHour.
                                        if (dataSet !== "forecastNextHour") return;
                                        switch (dataSet) {'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected one dataset dispatch block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          cd weatherkit-v320
          npm install --no-audit --no-fund
          npm run build
          cd ..
          cp weatherkit-v320/dist/response.bundle.js surge/weatherkit-next-hour-only.bundle.js
          grep -q 'Version: 3.2.0' surge/weatherkit-next-hour-only.bundle.js

      - name: Commit custom bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge/weatherkit-cn-response.bundle.js surge/weatherkit-next-hour-only.bundle.js
          if git diff --cached --quiet; then
            echo "No bundle changes"
            exit 0
          fi
          git commit -m "Update WeatherKit custom response bundles"
          git push
