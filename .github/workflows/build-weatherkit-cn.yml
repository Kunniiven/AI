name: Build WeatherKit CN response bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-weatherkit-cn.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Download official WeatherKit v3.2.0 response bundle
        run: |
          mkdir -p surge
          curl -fL --retry 3 \
            https://github.com/NSRingo/WeatherKit/releases/download/v3.2.0/response.bundle.js \
            -o surge/weatherkit-cn-response.bundle.js

      - name: Show next-hour injection context
        shell: python
        run: |
          from pathlib import Path
          s = Path("surge/weatherkit-cn-response.bundle.js").read_text()
          marker = "InjectForecastNextHour"
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit("InjectForecastNextHour marker not found")
          print(s[max(0, idx - 1200): idx + 2200])

      - name: Commit downloaded bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge/weatherkit-cn-response.bundle.js
          if git diff --cached --quiet; then
            echo "No bundle changes"
            exit 0
          fi
          git commit -m "Vendor WeatherKit v3.2.0 response bundle"
          git push
