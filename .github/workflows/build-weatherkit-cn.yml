name: Build WeatherKit CN response bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-weatherkit-cn.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Download official WeatherKit v3.2.0 response bundle
        run: |
          mkdir -p surge
          curl -fL --retry 3 \
            https://github.com/NSRingo/WeatherKit/releases/download/v3.2.0/response.bundle.js \
            -o surge/weatherkit-cn-response.bundle.js

      - name: Patch empty Apple next-hour placeholder
        shell: python
        run: |
          from pathlib import Path
          p = Path("surge/weatherkit-cn-response.bundle.js")
          s = p.read_text()
          old = 'if(e.info("☑️ InjectForecastNextHour"),t)return e.info("✅ InjectForecastNextHour"),t;'
          new = 'if(e.info("☑️ InjectForecastNextHour"),t&&Array.isArray(t.minutes)&&t.minutes.length>0)return e.info("✅ InjectForecastNextHour"),t;'
          count = s.count(old)
          if count != 1:
              raise SystemExit(f"Expected one next-hour guard, found {count}")
          patched = s.replace(old, new, 1)
          p.write_text(patched)
          if new not in p.read_text():
              raise SystemExit("Patched next-hour guard verification failed")

      - name: Commit patched bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surge/weatherkit-cn-response.bundle.js
          if git diff --cached --quiet; then
            echo "No bundle changes"
            exit 0
          fi
          git commit -m "Patch CN next-hour placeholder fallback"
          git push
